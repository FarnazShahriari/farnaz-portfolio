<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img">
<title>The model builder's journey, before the Model Builder was redesigned</title>
<desc>Nine steps in three zones. Before the tool, with the client: requirements analysis and requirements definition. In the Model Builder tool, Tom and the team: a new data model, entities, hierarchies, cubes and loading data. After delivery: customer revision with the client, then business users explore the data. Every client change goes back into the model, every day. Nine pain points, from requests the system cannot support, requirements that change after sign-off and entity limits that take 24 hours offline to raise, to 20 similar cubes made one by one, data lost when a cube changes dimension, and missing needs found late. A model is built from scratch one to two times a year, changed every day, and 70 to 80 percent of the work happens inside the tool.</desc>
