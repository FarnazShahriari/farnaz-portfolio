<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="6.4" refY="3.2" orient="auto">
      <path d="M0 0 L6.4 3.2 L0 6.4 z" fill="#2F6690"/>
    </marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="6.4" refY="3.2" orient="auto">
      <path d="M0 0 L6.4 3.2 L0 6.4 z" fill="#9FB3C4"/>
    </marker>
    <filter id="sh" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0B2A3F" flood-opacity="0.11"/>
    </filter>
  </defs>

  <!-- ============ LOOP PANEL ============ -->
  <rect x="396" y="108" width="664" height="264" rx="20" fill="#F2F7FA"/>
  <text x="418" y="132" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#7FA0B8">THE DESIGN LOOP, RUN TWICE</text>

  <!-- ============ ENTRY ============ -->
  <circle cx="76" cy="58" r="34" fill="#2F6690" filter="url(#sh)"/>
  <text x="76" y="56" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Kickoff</text>
  <text x="76" y="71" font-size="9.5" fill="#BFD6E6" text-anchor="middle">with the client</text>

  <path d="M114 58 H136" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <rect x="142" y="34" width="124" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="204" y="63" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Field study</text>

  <path d="M266 58 H288" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <rect x="294" y="34" width="150" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="369" y="63" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Scope and priority</text>

  <path d="M444 58 H500 V138" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <!-- ============ CYCLE ============ -->
  <rect x="435" y="144" width="130" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="500" y="173" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Sketch</text>

  <path d="M565 168 H679" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <rect x="685" y="144" width="170" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="770" y="173" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Prototype in Figma Make</text>
  <text x="770" y="211" font-size="11" fill="#86A3B8" text-anchor="middle">one prototype, both user groups</text>

  <path d="M770 224 V288" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <rect x="685" y="294" width="170" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="770" y="323" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Test with users</text>

  <rect x="878" y="296" width="152" height="20" rx="10" fill="#FFFFFF" stroke="#CBDCE8"/>
  <text x="893" y="310" font-size="10.5" font-weight="600" fill="#2F6690">round 1 &#183; 5 revisors</text>
  <rect x="878" y="322" width="152" height="20" rx="10" fill="#FFFFFF" stroke="#CBDCE8"/>
  <text x="893" y="336" font-size="10.5" font-weight="600" fill="#2F6690">round 2 &#183; 5 farmers</text>

  <path d="M685 318 H580" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <!-- findings hub -->
  <path d="M500 270 L572 318 L500 366 L428 318 Z" fill="#FFFFFF" stroke="#2F6690" stroke-width="1.8" filter="url(#sh)"/>
  <text x="500" y="322" font-size="12.5" font-weight="700" fill="#2F6690" text-anchor="middle">Findings</text>

  <!-- short return -->
  <path d="M500 270 V198" stroke="#9FB3C4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d)" fill="none"/>
  <text x="514" y="228" font-size="11" fill="#86A3B8">small problems,</text>
  <text x="514" y="243" font-size="11" fill="#86A3B8">fixed in the next round</text>

  <!-- deep branch -->
  <path d="M428 318 H318" stroke="#2F6690" stroke-width="2.2" marker-end="url(#s)" fill="none"/>
  <rect x="330" y="278" width="92" height="32" fill="#FFFFFF"/>
  <text x="376" y="291" font-size="11" font-weight="600" fill="#2F6690" text-anchor="middle">something</text>
  <text x="376" y="305" font-size="11" font-weight="600" fill="#2F6690" text-anchor="middle">deeper</text>

  <rect x="150" y="294" width="162" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="231" y="323" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Workshop with client</text>

  <path d="M231 294 V168 H429" stroke="#9FB3C4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#d)" fill="none"/>
  <rect x="262" y="158" width="150" height="20" fill="#FFFFFF"/>
  <text x="337" y="172" font-size="11" fill="#86A3B8" text-anchor="middle">a solution, back into the design</text>

  <!-- ============ EXIT ============ -->
  <path d="M500 366 V450 H609" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>
  <rect x="510" y="394" width="124" height="18" fill="#FFFFFF"/>
  <text x="514" y="407" font-size="11" fill="#6B7280">both rounds settled</text>

  <rect x="615" y="426" width="210" height="48" rx="24" fill="#FFFFFF" stroke="#E3EAF0" filter="url(#sh)"/>
  <text x="720" y="455" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Design translated into code</text>
  <text x="720" y="494" font-size="11" fill="#86A3B8" text-anchor="middle">React and TypeScript, pushed to GitHub for the developers</text>

  <path d="M825 450 H854" stroke="#2F6690" stroke-width="1.8" marker-end="url(#s)" fill="none"/>

  <circle cx="900" cy="450" r="40" fill="#2F6690" filter="url(#sh)"/>
  <text x="900" y="447" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Live</text>
  <text x="900" y="463" font-size="10" fill="#BFD6E6" text-anchor="middle">Sept 2026</text>
</svg>
